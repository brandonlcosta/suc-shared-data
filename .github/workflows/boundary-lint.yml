name: boundary-lint

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  boundary-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint:boundaries

